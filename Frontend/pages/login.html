<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - UaiiPonto</title>
  <link rel="stylesheet" href="../css/login.css">
  <script defer src="../js/apiConfig.js"></script>
  <script defer src="../js/conector.js"></script>
</head>
<body class="login-body">
  <div class="login-container">
    <form class="login-card">
      <h1 class="logo">UaiiPonto</h1>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="exemplo@gmail.com" required>

      <label for="password">Senha</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="******" required>
      </div>

      <button type="submit">Login</button>
      <p class="register-link">Não tem conta? <a href="cadastro.html">Cadastro</a></p>
    </form>
  </div>
</body>
</html>
