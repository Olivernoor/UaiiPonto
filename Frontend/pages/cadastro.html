<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - UaiiPonto</title>
  <link rel="stylesheet" href="../css/cadastro.css">
  <script defer src="../js/apiConfig.js"></script>
  <script defer src="../js/conector.js"></script>
</head>
<body class="cadastro-body">
  <div class="cadastro-container">
    <form class="cadastro-card">
      <h1 class="logo">UaiiPonto</h1>

      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Nome do usuário" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="exemplo@gmail.com" required>

      <label for="organizacao">Organização</label>
      <input type="text" id="organizacao" placeholder="Nome da organização">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="******" minlength="6" required>

      <label for="confirmar-senha">Confirmar Senha</label>
      <input type="password" id="confirmar-senha" placeholder="******" minlength="6" required>

      <button type="submit">Concluir</button>
      <p class="login-link">Já tem conta? <a href="login.html">Login</a></p>

      <div id="feedback"></div>
    </form>
  </div>
</body>
</html>
